<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0">
		<meta name="mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="theme-color" content="#000000">
		<meta name="description" content="DEEPSUB — blind-cockpit deep-sea horror.">
		<meta property="og:title" content="DEEPSUB">
		<meta property="og:description" content="Blind-cockpit deep-sea horror.">
		<meta property="og:image" content="index.png">
		<title>DEEPSUB</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

html, body {
	height: 100%;
}

body {
	color: #66ff9e;
	background-color: black;
	overflow: hidden;
	touch-action: none;
	overscroll-behavior: none;
	-webkit-user-select: none;
	user-select: none;
	-webkit-touch-callout: none;
	-webkit-tap-highlight-color: transparent;
	font-family: 'Courier New', Courier, monospace;
}

#canvas {
	display: block;
	image-rendering: pixelated;
}

#canvas:focus {
	outline: none;
}

#status, #turn {
	position: absolute;
	left: 0;
	right: 0;
	top: 0;
	bottom: 0;
	background-color: black;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	text-align: center;
}

#status {
	visibility: hidden;
}

#status-title {
	font-size: min(14vw, 22vh);
	font-weight: bold;
	letter-spacing: 0.08em;
}

#status-line {
	color: #38995f;
	font-size: min(2.6vw, 4.4vh);
	letter-spacing: 0.12em;
	margin-top: 0.6em;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	appearance: none;
	-webkit-appearance: none;
	width: 46%;
	height: 6px;
	margin-top: 2.2em;
	border: 1px solid #247347;
	background: #000a08;
}

#status-progress::-webkit-progress-bar {
	background: #000a08;
}

#status-progress::-webkit-progress-value {
	background: #66ff9e;
}

#status-progress::-moz-progress-bar {
	background: #66ff9e;
}

#status-notice {
	border: 1px solid #ff4533;
	color: #ffbd38;
	line-height: 1.4;
	margin: 2em 2rem 0;
	padding: 1rem;
	z-index: 1;
}

/* A phone held upright has no room for the cockpit. Say so, over everything. */
#turn {
	display: none;
	z-index: 10;
	color: #ffbd38;
	font-size: 5.5vw;
	letter-spacing: 0.1em;
	line-height: 1.6;
}

@media (orientation: portrait) and (pointer: coarse) {
	#turn {
		display: flex;
	}
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<div id="status-title">DEEPSUB</div>
			<div id="status-line">FLOODING THE TANKS</div>
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<div id="turn">
			<div>TURN THE SCREEN<br>ON ITS SIDE</div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":40278956,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const canvas = document.getElementById('canvas');
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	// A long press, a pinch or a double tap belongs to the game, not to the page.
	['contextmenu', 'gesturestart', 'gesturechange', 'dblclick', 'selectstart'].forEach((name) => {
		document.addEventListener(name, (event) => event.preventDefault(), { passive: false });
	});
	// Keys reach the game only while the canvas has the focus, and a page inside a frame starts without it.
	['pointerdown', 'touchstart'].forEach((name) => {
		window.addEventListener(name, () => canvas.focus(), { passive: true });
	});

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		const missingMsg = 'This browser cannot run the game. It is missing:\n';
		displayFailureNotice(missingMsg + missing.join('\n'));
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
