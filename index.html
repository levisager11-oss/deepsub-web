	let unlocking = false;
	async function unlock() {
		if (unlocking || !contexts.size) return;
		unlocking = true;
		try {
			await Promise.all([...contexts].filter(c => c.state !== 'closed').map(async c => {
				await c.resume();
				const source = c.createBufferSource(); source.buffer = c.createBuffer(1, 1, c.sampleRate);
				source.connect(c.destination); source.start(0);

				for (const event of ['touchstart', 'pointerdown', 'keydown']) window.removeEventListener(event, unlock, true);

		finally { unlocking = false; }
	}
